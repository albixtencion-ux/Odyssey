/* ===== MODUL: Noise (procedural) ===== */
const Noise={
  hash(x,y,s){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1274126177);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295},

    const a=this.hash(xi,yi,s),b=this.hash(xi+1,yi,s),c=this.hash(xi,yi+1,s),d=this.hash(xi+1,yi+1,s);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v},
  fbm(x,y,s){let t=0,a=.5,f=1,n=0;for(let i=0;i<4;i++){t+=a*this.value(x*f,y*f,s+i*17);n+=a;a/=2;f*=2}return t/n}
};

  gen(x,y){const sd=this.seed,sc=this.pf.sc,el=Noise.fbm(x/sc,y/sc,sd),mo=Noise.fbm(x/18+200,y/18+200,sd+9),tp=Noise.fbm(x/60+400,y/60+400,sd+31);
    const P=this.pf;let t;if(el<P.w)t=T.DEEP;else if(el<P.w+.06)t=T.SHALLOW;else if(el<P.w+.09)t=T.SAND;else if(el>P.rk)t=T.ROCK;else if(el>P.rk-.08)t=T.STONE;else if(tp+P.dt<.43)t=T.ICE;else if(tp+P.dt>.58&&mo<.5)t=T.DESERT;else if(tp+P.dt>.52&&mo>.55-P.tx)t=T.TOXIC;else t=mo<.5?T.SOIL:T.GRASS;

  findSpawn(){for(let r=0;r<40;r++)for(let a=-r;a<=r;a++)for(const[x,y]of[[a,-r],[a,r],[-r,a],[r,a]]){
    if(!this.blocked(x,y)&&this.at(x,y)[0]>=T.SAND&&this.at(x,y)[1]===0)return{x:x+.5,y:y+.5}}return{x:.5,y:.5}},
  biomeName(t){return Tr(["Laut Dalam","Perairan Dangkal","Pasir Bercahaya","Tanah Ungu","Hutan Alien","Dataran Batu","Pegunungan","Tundra Es","Gurun Karat","Rawa Beracun"][t])}

const ICO={"Iron Ore":["Fe","#d9a073"],"Copper":["Cu","#e08a3c"],"Titanium":["Ti","#b8c8ff"],"Carbon":["C","#ff9a5a"],"Crystal":["◆","#5ff3ff"],"Alien Organic Matter":["✿","#35e0a0"],"Rare Element":["✦","#ff5fd0"],"Oxygen Cell":["O₂","#9ffcff"],"Power Cell":["⚡","#ffd35f"],"Repair Kit":["+","#ff6a7a"]};
const DESC={"Iron Ore":"Bijih besi dasar untuk bangunan dan perlengkapan.","Copper":"Konduktor untuk listrik dan teknologi.","Titanium":"Logam ringan dan kuat untuk upgrade.","Carbon":"Bahan bakar Generator dan filter.","Crystal":"Penyimpan energi, bahan sel daya dan Solar Panel.","Alien Organic Matter":"Materi hayati alien untuk obat dan filter.","Rare Element":"Langka. Dipakai untuk thruster dan misi akhir.","Oxygen Cell":"Pakai: +50 oksigen.","Power Cell":"Pakai: +50 energi.","Repair Kit":"Pakai: +40 HP."};
const ic=k=>{if(SPR[k])return`<span class="ic sp" style="background-position:-${SPR[k][1]*32}px -${SPR[k][0]*32}px"></span>`;const a=ICO[k]||["?","#888"];return`<span class=ic style="background:${a[1]}">${a[0]}</span>`};
const Nav={wps:{},f:-99,qs:null,c:null,
 wp(){return this.wps[Planet.seed]},
 toggleWp(){if(Game.mode!=="planet"||!Game.started)return;if(this.wp()){delete this.wps[Planet.seed];Egg.say("Waypoint dihapus")}else{this.wps[Planet.seed]={x:Player.x,y:Player.y};Egg.say("Waypoint ditandai di sini")}},
 space(){const q=Quest.act().find(q=>q.m);if(!q||!/planet/.test(q.d))return null;let b=null,bd=1e15;for(const p of GalaxyMap.list()){if(Space.visited.has(p.seed))continue;const d=(p.x-Space.x)**2+(p.y-Space.y)**2;if(d<bd){bd=d;b=p}}return b},
 qt(q){if(Game.frame-this.f<20&&this.qs===Planet.seed)return this.c;this.f=Game.frame;this.qs=Planet.seed;this.c=null;
  if(q&&q.id==="m1"){let bd=99;const px=Math.floor(Player.x),py=Math.floor(Player.y);for(let y=py-14;y<=py+14;y++)for(let x=px-14;x<=px+14;x++)if(RES[Planet.at(x,y)[1]]){const d=Math.hypot(x-Player.x,y-Player.y);if(d<bd){bd=d;this.c={x:x+.5,y:y+.5,c:"#ffd35f",n:"Tambang"}}}}return this.c},
 list(){const a=[{x:Ship.x,y:Ship.y,c:"#5ff3ff",n:"Pesawat"}],q=Quest.act().find(q=>q.m);
  const b=Base.list().find(b=>b.k!=="PAD");if(b)a.push({x:b.x+.5,y:b.y+.5,c:"#ff9a4a",n:"Base"});
  const w=this.wp();if(w)a.push({x:w.x,y:w.y,c:"#ffffff",n:"Waypoint"});
  const t=this.qt(q);if(t)a.push(t);
  if(q&&q.id==="m4"){const r=Base.list().find(b=>b.k==="RES");if(r)a.push({x:r.x+.5,y:r.y+.5,c:"#ffd35f",n:"Riset"})}
  if(Quest.act().some(q=>q.id==="s1")){let n=null,nd=99;for(const c of Fauna.list){const d=Math.hypot(c.x-Player.x,c.y-Player.y);if(d<nd){nd=d;n={x:c.x,y:c.y,c:"#9aff9a",n:"Makhluk"}}}if(n)a.push(n)}
  return a},
 draw(){if(Game.mode!=="planet"||Game.map||!Opt.hud||Game.trans)return;const g=Renderer.g,W=Renderer.W,H=Renderer.H;g.font="8px monospace";g.textBaseline="top";
  for(const t of this.list()){const d=Math.hypot(t.x-Player.x,t.y-Player.y),sx=W/2+(t.x-Camera.x)*TS,sy=H/2+(t.y-Camera.y)*TS,m=14;if(d<2.5)continue;g.fillStyle=t.c;
   if(sx>m&&sx<W-m&&sy>m&&sy<H-m){g.beginPath();g.moveTo(sx,sy-9);g.lineTo(sx+4,sy-14);g.lineTo(sx-4,sy-14);g.fill();g.textAlign="center";g.fillText(Tr(t.n)+" "+Math.round(d),sx,sy-24)}
   else{const a=Math.atan2(sy-H/2,sx-W/2),k=Math.min((W/2-m)/Math.abs(Math.cos(a)||1e-6),(H/2-m)/Math.abs(Math.sin(a)||1e-6)),ex=W/2+Math.cos(a)*k,ey=H/2+Math.sin(a)*k;
    g.save();g.translate(ex,ey);g.rotate(a);g.beginPath();g.moveTo(6,0);g.lineTo(-4,-4);g.lineTo(-4,4);g.fill();g.restore();g.textAlign=ex>W/2?"right":"left";g.fillText(Math.round(d)+"m",ex+(ex>W/2?-8:8),ey-4)}}
  g.textAlign="left"},
 mini(mx,my,s,x0,y0,N){const g=Renderer.g,f=s/N,dot=(x,y,c,z)=>{const u=mx+(x-x0)*f,v=my+(y-y0)*f;if(u<mx||v<my||u>mx+s||v>my+s)return;g.fillStyle=c;g.fillRect(Math.round(u-z/2),Math.round(v-z/2),z,z)};
  dot(Ship.x,Ship.y,"#5ff3ff",3);for(const b of Base.list())dot(b.x+.5,b.y+.5,"#ff9a4a",2);const w=this.wp();if(w)dot(w.x,w.y,"#fff",3);for(const c of Fauna.list)dot(c.x,c.y,c.sp.beh===2?"#ff3a3a":"#9aff9a",2);
  g.fillStyle="#9ffcff";g.textAlign="center";g.fillText("N",mx+s/2,my+1);g.textAlign="left"}
};

const Game={started:false,fps:60,frame:0,last:0,time:0,hint:6,mode:"planet",map:false,trans:null,
  go(cb,col,txt,an){const u=an==="up",d=an==="down";this.trans={t:0,dur:u?4.5:d?5:2,mid:u?.62:d?.4:.5,anim:an,cb,col,txt,fired:false}},
  begin(c){document.getElementById("title").style.display="none";try{if(c)Save.load();else{Save.wipe();Save.msg="";localStorage.removeItem("so_tut")}}catch(e){}this.started=true;if(!Tut.seen())Tut.start()},
  toggleMap(){if(!this.trans&&!Menu.open)this.map=!this.map},
  act(){if(this.trans||Menu.open||!this.started)return;if(this.map){this.map=false;return}
