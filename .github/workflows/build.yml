name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Landscape + fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' "$S"

      - name: App icon
        run: |
          if [ -f icon.png ]; then
            R=android/app/src/main/res
            rm -rf $R/mipmap-anydpi-v26
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp icon.png $R/mipmap-$d/ic_launcher.png
              cp icon.png $R/mipmap-$d/ic_launcher_round.png
              cp icon.png $R/mipmap-$d/ic_launcher_foreground.png
            done
          fi

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: starbound-odyssey-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
